<style>
:root {

  --page: #efeee9; --surface: #fcfcfb; --surface-2: #f4f3ef; --line: rgba(11,11,11,.10);

}
@media (prefers-color-scheme: dark) {

    --page: #0e0e0d; --surface: #1a1a19; --surface-2: #232321; --line: rgba(240,239,236,.11);
    --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f; --grid: rgba(240,239,236,.09);

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e0e0d; --surface: #1a1a19; --surface-2: #232321; --line: rgba(240,239,236,.11);
  --text: #f0efec; --text-2: #c3c2b7; --muted: #9a998f; --grid: rgba(240,239,236,.09);

  --critical: #e66767; --warn: #fab219;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--text); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--c-realty); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 56px; }

/* ---- header ---- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 0 14px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { width: 38px; height: 38px; flex: none; }
h1 { font: 650 24px/1.1 var(--display); letter-spacing: -.01em; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; color: var(--text-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); position: relative; }
.dot.live::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--good); opacity: 0; animation: pulse 2.4s ease-out infinite; }
.dot.stale { background: var(--warn); } .dot.sample { background: var(--c-neutral); }
@keyframes pulse { 0% { transform: scale(.5); opacity: .8; } 100% { transform: scale(1.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .dot.live::after { animation: none; } }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); }
.icon-btn:hover { background: var(--surface-2); }

/* ---- tabs ---- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 18px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--text-2); white-space: nowrap; font-weight: 500; }

.tab i { width: 10px; height: 10px; border-radius: 3px; background: var(--c-neutral); }

/* ---- tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 14px; min-width: 0; }
.t-label { color: var(--muted); font-size: 13px; }
.t-value { font: 600 30px/1.15 var(--display); letter-spacing: -.015em; margin: 6px 0 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.chip svg { width: 11px; height: 11px; flex: none; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px; min-width: 0; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
.span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }

h2 { font: 600 16px/1.3 var(--display); letter-spacing: -.005em; margin: 0; }
.card header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.tbl-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 10px; font-size: 12.5px; color: var(--text-2); flex: none; }
.tbl-btn:hover, .tbl-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font-size: 13px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.plot { position: relative; height: 270px; }
.plot.short { height: 220px; }
.tblwrap { max-height: 300px; overflow: auto; margin-top: 4px; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; padding-right: 0; padding-left: 10px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); min-width: 90px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat b { display: block; font: 600 24px/1.2 var(--display); font-variant-numeric: tabular-nums; }

.note { color: var(--muted); font-size: 13px; line-height: 1.55; }

.err { padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }

<script>
(function () {
  'use strict';

  /* ---------- formatting ---------- */
  function compact(n) {
    var a = Math.abs(n), s = n < 0 ? '-' : '';

  function minutes(m) {

    if (m >= 60) return '1 h ' + Math.round(m - 60) + ' min';

    return '<span class="chip ' + (good ? 'up' : 'down') + '"><svg viewBox="0 0 11 11" aria-hidden="true">' + arrow + '</svg>' +
      (up ? '+' : '') + p.toFixed(1) + '%<span class="sr" style="position:absolute;left:-9999px">' + (good ? ' improvement' : ' decline') + '</span></span>';
  }

  }

  /* ---------- chart plumbing ---------- */
  function destroyCharts() { charts.forEach(function (c) { c.destroy(); }); charts = []; }
  function baseOptions(extra) {
    var o = {

      else a[k] = b[k];
    });

  }

  }
  function card(id, title, subtitle, span, legend, short) {

      '<div class="plot' + (short ? ' short' : '') + '"><canvas id="cv-' + id + '" role="img" aria-label="' + esc(title) + '"></canvas></div><div class="tblwrap" id="tb-' + id + '" hidden></div></section>';
  }
  function mk(id, config) {

  }
  function wireTables() {

  function rolling(arr, n) { return arr.map(function (_, i) { var s = arr.slice(Math.max(0, i - n + 1), i + 1); return Math.round(s.reduce(function (a, b) { return a + b; }, 0) / s.length); }); }

  /* ---------- views ---------- */
  function groupView(D) {

      tile('Hours saved since launch', int(A.hours_saved_total) + '<small>h</small>', int(A.runs_total) + ' logged workflow runs') +
      tile('Hours saved, 30 days', int(A.hours_saved_30d) + '<small>h</small>', 'from the Automation Ledger') +
      tile('First reply to a lead', minutes(A.first_response_after_min), 'was ' + minutes(A.first_response_before_min) + ' before launch') +
      tile('Tickets resolved by agent', A.agent_share_pct.toFixed(0) + '%', A.tickets_30d + ' tickets in 30 days') +
      tile('Support reply time', seconds(A.agent_response_sec), 'agent · people took ' + seconds(A.human_response_before_sec) + ' before') + '</div>' +
      '<div class="grid">' +
      card('a-fr', 'Average first reply to a new lead', 'Weekly average, minutes. Dashed line marks the automation launch', 7, '') +
      card('a-wf', 'Hours saved by workflow', 'Since launch', 5, '', false) + '</div>' +
      '<div class="grid">' +
      card('a-wk', 'Hours saved per week', 'Logged by the workflows', 5, '', true) +
      '<section class="card span-7"><header><div><h2>Automation backlog, ranked</h2><p>Monthly hours a process could save: hours × feasibility score</p></div></header><table><tr><th>Process</th><th>Hours / month</th><th>Feasibility</th><th>Status</th></tr>' +
      A.top_processes.map(function (p) {
        var st = p.status.toLowerCase();
        var dots = [1, 2, 3, 4, 5].map(function (i) { return '<i class="' + (i <= p.feasibility ? 'on' : '') + '"></i>'; }).join('');
        return '<tr><td>' + esc(p.process) + '<div class="note" style="font-size:12px">' + esc(p.business) + '</div></td><td><div style="display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1;min-width:60px"><i style="width:' + Math.round(p.saveable_hours / maxS * 100) + '%;background:var(--c-realty)"></i></div><span>' + p.saveable_hours + '</span></div></td><td><span class="dots" role="img" aria-label="' + p.feasibility + ' out of 5">' + dots + '</span></td><td><span class="status-tag ' + st + '"><i></i>' + esc(p.status) + '</span></td></tr>';
      }).join('') + '</table></section></div>' +
      '<section class="card"><h2>How these numbers are measured</h2><p class="note" style="margin:8px 0 0">Each workflow appends one row to an Automation Ledger sheet every time it runs, with the minutes it saved compared with the manual baseline timed during testing. Response times come from the lead and ticket logs. The data on this page is synthetic, so treat the figures as a demonstration of the method, not as results from a real company.</p></section>';
    return {
      html: html, draw: function () {
        var fr = A.first_response_trend, lbl = fr.map(function (w) { return shortDate(w.week); });
        var goLive = { id: 'goLive', afterDatasetsDraw: function (chart) {
          var gl = D.go_live, i = -1;
          for (var n = 0; n < fr.length; n++) if (fr[n].week <= gl) i = n;
          if (i < 0 || i >= fr.length - 1) return;
          var span = (new Date(fr[i + 1].week) - new Date(fr[i].week)) / 864e5, frac = (new Date(gl) - new Date(fr[i].week)) / 864e5 / span;
          var x = chart.scales.x.getPixelForValue(i + frac), ys = chart.scales.y, ctx = chart.ctx;
          ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = css('--text-2'); ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x, ys.top); ctx.lineTo(x, ys.bottom); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = css('--text'); ctx.font = '600 12px ' + css('--body'); ctx.textAlign = 'left'; ctx.fillText('Automation live', x + 8, ys.top + 14); ctx.restore();
        } };
        mk('a-fr', { type: 'line', plugins: [goLive], data: { labels: lbl, datasets: [{ label: 'Minutes to first reply', data: fr.map(function (w) { return w.minutes; }), borderColor: css('--c-realty'), backgroundColor: css('--c-realty'), borderWidth: 2, pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: css('--c-realty'), pointBorderColor: css('--surface'), pointBorderWidth: 2, tension: .25 }] },
          options: baseOptions({ plugins: { tooltip: { callbacks: { label: function (c) { return ' ' + minutes(c.parsed.y) + ' to first reply'; } } } }, scales: { y: { ticks: { callback: function (v) { return v + ' min'; } } } } }) });
        mk('a-wf', { type: 'bar', data: { labels: A.hours_by_workflow.map(function (w) { return w.name; }), datasets: [{ label: 'Hours saved', data: A.hours_by_workflow.map(function (w) { return w.value; }), backgroundColor: css('--c-realty'), ...rightRound, barThickness: 16 }] },
          options: baseOptions({ indexAxis: 'y', interaction: { axis: 'y' }, scales: { y: { grid: { display: false }, ticks: { color: css('--text-2') } } } }) });
        mk('a-wk', { type: 'bar', data: { labels: A.hours_weekly.map(function (w) { return shortDate(w.week); }), datasets: [{ label: 'Hours saved', data: A.hours_weekly.map(function (w) { return w.hours; }), backgroundColor: css('--c-realty'), ...topRound, maxBarThickness: 22 }] },
          options: baseOptions({}) });
      }
    };
  }
  function addDays(d, n) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); }

  /* ---------- shell ---------- */
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(function (t) {
      var sw = t.color ? 'style="background:var(' + t.color + ')"' : '';
      return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === state.tab) + '"><i ' + sw + '></i>' + esc(t.label) + '</button>';
    }).join('');
    document.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () { state.tab = b.getAttribute('data-tab'); try { history.replaceState(null, '', '#' + state.tab); } catch (e) {} render(); });
    });
  }
  function render() {
    if (!state.data) return;
    destroyCharts(); renderTabs();
    var D = state.data, v = state.tab === 'group' ? groupView(D) : state.tab === 'automation' ? automationView(D) : businessView(D, state.tab);
    $('#view').innerHTML = v.html; v.draw(); wireTables();
  }
  function ago(iso) {
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' days ago';
  }
  function updateStatus() {
    var D = state.data, dot = $('#statusPill .dot'), t = $('#statusText');
    if (!D) return;
    var age = (Date.now() - new Date(D.generated_at).getTime()) / 36e5;
    if (state.usingSample) { dot.className = 'dot sample'; t.textContent = 'Bundled sample data · ' + shortDate(D.ref_date); }
    else if (age > 3) { dot.className = 'dot stale'; t.textContent = 'Last synced ' + ago(D.generated_at); }
    else { dot.className = 'dot live'; t.textContent = 'Live · synced ' + ago(D.generated_at); }
    $('#footL').textContent = 'Window: ' + shortDate(D.window.from) + ' to ' + shortDate(D.window.to) + ' · automations launched ' + shortDate(D.go_live);
  }
  function load(first) {
    return fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { state.usingSample = false; return d; })
      .catch(function () { state.usingSample = true; return JSON.parse($('#sample').textContent); })
      .then(function (d) {
        var changed = !state.data || state.data.generated_at !== d.generated_at;
        state.data = d; updateStatus(); if (changed || first) render();
      });
  }
  function boot() {
    var h = (location.hash || '').replace('#', '');
    if (TABS.some(function (t) { return t.id === h; })) state.tab = h;
    $('#themeBtn').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      render();
    });
    try { var s = localStorage.getItem('theme'); if (s) document.documentElement.setAttribute('data-theme', s); } catch (e) {}
    var go = function () { load(true); setInterval(function () { load(false); }, REFRESH_MS); setInterval(updateStatus, 30000); };
    if (window.Chart) go(); else window.addEventListener('load', go);
  }
  boot();
})();
</script>
</body>
